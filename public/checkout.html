fter sending payment. Never upload passwords or identity documents.</p><button class="button button-primary button-full" type="submit">Submit order</button><p id="checkout-message" class="form-message"></p></form></div></main><footer class="site-footer"><span>© <span id="year"></span> Digitally Anne</span><span>Built with care ♡</span></footer><div id="toast" class="toast" role="status" aria-live="polite"></div><script src="/assets/js/config.js"></script><script src="/assets/js/checkout.js"></script></body></html>
