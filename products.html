<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Products & Services · Digitally Anne</title><style>body{margin:0;background:#fff8ef;color:#35291f;font:16px Inter,system-ui,sans-serif}.wrap{max-width:1000px;margin:auto;padding:35px 20px}h1{font:clamp(2.3rem,6vw,4rem) Georgia,serif}.muted{color:#76695d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}.card{background:white;border:1px solid #eadbcc;border-radius:18px;padding:20px}.card img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px}a,button{color:#fff;background:#d97732;padding:12px 16px;border-radius:10px;text-decoration:none;border:0;display:inline-block}.price{font-size:1.4rem;font-weight:bold;color:#79543a}</style></head><body><main class="wrap"><p><b>Digitally Anne</b></p><h1>Products & services</h1><p class="muted">Thoughtful tools and services, with a simple way to complete your payment.</p><div id="catalog" class="grid">Loading catalogue…</div><p><a href="/">Back to checkout</a></p></main><script>const e=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('/api/products').then(r=>r.json()).then(items=>{const root=document.getElementById('catalog');if(!Array.isArray(items)||!items.length){root.innerHTML='<p class="muted">Products and services coming soon. You can still use the checkout to support the work.</p>';return}root.innerHTML=items.map(p=>`<article class="card">${p.image_url?`<img src="${e(p.image_url)}" alt="">`:''}<h2>${e(p.name)}</h2><p>${e(p.description)}</p><p class="price">₱${Number(p.price_php).toLocaleString('en-PH',{minimumFractionDigits:2})}</p><p class="muted">To purchase, use the checkout and include the product name in your details.</p><a href="/?product=${encodeURIComponent(p.slug)}">Continue to checkout</a></article>`).join('')}).catch(()=>document.getElementById('catalog').textContent='Catalogue unavailable. Please try again later.');</script></body></html>
