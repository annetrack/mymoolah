<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support Anne · Digitally Anne</title><link rel="stylesheet" href="/assets/styles.css"></head><body><header class="wrap topbar"><a class="brand" href="/"><span class="brand-mark">A</span><span>Digitally Anne<small>A place for value to flow</small></span></a><a class="back" href="/">← Back</a></header><main class="wrap page-shell"><div class="eyebrow">Support Anne · Step 1 of 2</div><h1 class="page-title">Your details</h1><p class="lead">Add your contact information, then choose how you’d like to send your contribution.</p><form id="detailsForm" class="panel"><div class="form-grid"><div class="field"><label for="first">First name *</label><input id="first" required maxlength="100" autocomplete="given-name"></div><div class="field"><label for="last">Last name</label><input id="last" maxlength="100" autocomplete="family-name"></div><div class="field"><label for="email">Email address *</label><input id="email" type="email" required maxlength="254" autocomplete="email"></div><div class="field"><label for="phone">Phone (optional)</label><input id="phone" type="tel" maxlength="50" autocomplete="tel"></div><div class="field full"><label for="amount">Contribution amount (PHP) *</label><input id="amount" type="number" min="1" max="10000000" step="0.01" value="500" required><span class="help">Choose the amount you wish to contribute.</span></div></div><div style="display:flex;justify-content:flex-end;margin-top:22px"><button type="submit">Continue to payment ↗</button></div></form></main><footer class="wrap footer"><span>© <span id="year"></span> Digitally Anne</span></footer><script>document.getElementById('year').textContent=new Date().getFullYear();document.getElementById('detailsForm').onsubmit=e=>{e.preventDefault();const d={first_name:document.getElementById('first').value.trim(),last_name:document.getElementById('last').value.trim(),email:document.getElementById('email').value.trim(),phone:document.getElementById('phone').value.trim(),amount:Number(document.getElementById('amount').value)};if(!Number.isFinite(d.amount)||d.amount<1){alert('Enter a valid contribution amount.');return}sessionStorage.setItem('daCheckoutDetails',JSON.stringify(d));sessionStorage.setItem('daCheckoutCart',JSON.stringify([]));location.href='/checkout.html?type=support'};</script></body></html>
